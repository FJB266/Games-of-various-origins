<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weaver's Wake</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'VT323',monospace;color:#e8e8f5;overflow:hidden}
#hud{width:800px;background:#11111c;border:1px solid #252540;border-radius:4px 4px 0 0;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
#hud-title{color:#7c6af7;font-size:13px;letter-spacing:2px}
#hud-task{color:#ffd700}
#hud-party{display:flex;align-items:center;gap:8px;font-size:16px}
.hpbar{width:90px;height:8px;background:#222;border-radius:3px;overflow:hidden}
.hpfill{height:100%;background:#4caf50;border-radius:3px;transition:width .2s,background .2s}
canvas{display:block}
#controls{width:800px;background:#0d0d18;border:1px solid #252540;border-radius:0 0 4px 4px;padding:5px 0;text-align:center;color:#44445a;font-size:15px}
</style>
</head>
<body>
<div id="hud">
  <span id="hud-title">WEAVER'S WAKE</span>
  <span id="hud-task">▶ Find the Elder Scroll</span>
  <div id="hud-party">
    <span id="pname">Chromapup Lv1</span>
    <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
    <span id="hptext"></span>
  </div>
</div>
<canvas id="c" width="800" height="560"></canvas>
<div id="controls">WASD / Arrow Keys — Move &nbsp;|&nbsp; Space / Enter — Talk &nbsp;|&nbsp; ESC — Run (wild only)</div>

<script>
// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const T = 48;          // tile size px
const COLS = 36;       // map columns
const ROWS = 28;       // map rows
const VW = 800, VH = 560;

// ─────────────────────────────────────────────
// INPUT  (simple edge detection)
// ─────────────────────────────────────────────
const keys = {}, prevKeys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.key] = false; });
function held(k)    { return !!keys[k]; }
function trig(k)    { return !!keys[k] && !prevKeys[k]; }
function trigAny(...ks){ return ks.some(k => trig(k)); }
function heldAny(...ks){ return ks.some(k => held(k)); }
function flushInput(){ Object.assign(prevKeys, keys); }

// ─────────────────────────────────────────────
// MAP  (0=grass 1=wall 2=water 3=dirt 4=tall grass)
// ─────────────────────────────────────────────
const RAW = [
 "111111111111111111111111111111111111",
 "100000000000000000000000000000000001",
 "100000003333330000000000000000000001",
 "100000003000030000011111110000000001",
 "100033333000030000010000010000000001",
 "100030000000030000010000010000000001",
 "100030100000030000010000010004440001",
 "100030100000000000010000010044440001",
 "100030000000000000011111110044440001",
 "100033333000000000000000000004440001",
 "100000000000444000000000000000000001",
 "100000000044444400000000000000000001",
 "111111100044444400000000000044000001",
 "100000000044444400000000000444400001",
 "100022200000444000000000000440000001",
 "100022200000000000000000000000000001",
 "100022200000000001111110000000000001",
 "100000000000000001000010000000000001",
 "100000000000000001000010000000000001",
 "100000000000000001000010000000000001",
 "100004444000000001000010000000000001",
 "100004444000000001111110000000000001",
 "100004444000000000000000000000000001",
 "100000000000000000000000000000000001",
 "100000000000000000444444000000000001",
 "100000000000000000444444000000000001",
 "100000000000000000000000000000000001",
 "111111111111111111111111111111111111",
];
const MAP = RAW.map(r => r.split('').map(Number));

function walkable(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return false;
  return MAP[gy][gx] !== 1 && MAP[gy][gx] !== 2;
}

// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const MOVES = {
  TACKLE:    { name:'Tackle',      power:18, acc:95, type:'normal',   desc:'A solid hit.' },
  INK_BLOT:  { name:'Ink Blot',   power:30, acc:90, type:'magic',    desc:'Smothers in ink.' },
  VOID_BURN: { name:'Void Burn',  power:40, acc:85, type:'fire',     desc:'Scorches with void.' },
  MEND:      { name:'Mend',       power: 0, acc:100,type:'heal',     desc:'Restore 35 HP.' },
  SPARK:     { name:'Spark',      power:24, acc:92, type:'electric', desc:'Static shock.' },
  SHADOW:    { name:'Shadow Fang',power:34, acc:88, type:'dark',     desc:'A dark bite.' },
};
const MTYPE_COL = { normal:'#9e9e9e', magic:'#ab47bc', fire:'#ef5350', heal:'#66bb6a', electric:'#ffd54f', dark:'#8e24aa' };

class Mon {
  constructor(name, maxHp, atk, moveKeys, col, shape) {
    this.name = name; this.maxHp = maxHp; this.hp = maxHp;
    this.atk = atk; this.col = col; this.shape = shape;
    this.moves = moveKeys.map(k => ({ ...MOVES[k] }));
    this.lv = 1; this.xp = 0;
  }
  addXP(n) {
    this.xp += n;
    const need = this.lv * 60;
    if (this.xp >= need) {
      const oldLv = this.lv;
      this.lv++; this.xp -= need;
      const hpGain = Math.floor(this.maxHp * 0.1);
      this.maxHp += hpGain;
      this.hp = Math.min(this.hp + hpGain, this.maxHp);
      this.atk = parseFloat((this.atk + 0.05).toFixed(2));
      return { oldLv, newLv: this.lv, hpGain };
    }
    return null;
  }
  heal(n) { this.hp = Math.min(this.maxHp, this.hp + n); }
}

// ─────────────────────────────────────────────
// PLAYER
// ─────────────────────────────────────────────
// All movement is purely grid-based. px/py are ONLY used for camera & drawing.
// They are always gx*T, gy*T — no interpolation.
const player = {
  gx: 2, gy: 3,
  get px() { return this.gx * T; },
  get py() { return this.gy * T; },
  dir: 'down',
  mon: new Mon('Chromapup', 100, 1.0, ['INK_BLOT','SPARK','MEND','TACKLE'], '#42a5f5', 'dog'),
};

// Camera (clamped pixel offset)
const cam = { x: 0, y: 0 };
function updateCam() {
  cam.x = Math.max(0, Math.min(COLS*T - VW, player.px - VW/2 + T/2));
  cam.y = Math.max(0, Math.min(ROWS*T - VH, player.py - VH/2 + T/2));
}

// ─────────────────────────────────────────────
// NPCs
// ─────────────────────────────────────────────
const NPCS = [
  {
    id:'SCROLL', gx:5, gy:4, col:'#ffd700', label:'Elder Scroll',
    dlg:[
      ["Elder Scroll","The Canvas is unravelling, young Weaver."],
      ["Elder Scroll","A Void Drake shattered the Loom Shard — reality frays without it."],
      ["Elder Scroll","Travel east. The Red Guardian guards the shard deep in the ruins."],
      ["Elder Scroll","The Weave depends on you. Go."],
    ]
  },
  {
    id:'SAGE', gx:28, gy:4, col:'#66bb6a', label:'Hermit Sage',
    dlg:[
      ["Hermit Sage","Weary traveller... let me restore your companion."],
    ],
    healer: true
  },
  {
    id:'GUARDIAN', gx:28, gy:17, col:'#ef5350', label:'Red Guardian',
    dlg:[
      ["Red Guardian","So you crossed the glitch fields to reach me."],
      ["Red Guardian","The Void Drake's corruption consumes me. I cannot resist it."],
      ["Red Guardian","Defeat the Drake within me — free us both!"],
    ],
    battleKey: 'VOID_DRAKE'
  },
];

// ─────────────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────────────
const S = { TITLE:0, OW:1, DLG:2, BATTLE:3, WIN:4, LEVELUP:5, MP:6 };
let state = S.TITLE;
let titleCursor = 0; // 0=singleplayer 1=multiplayer
let lvUpData = null; // {oldLv, newLv, hpGain}
let questStep = 0;

// ─────────────────────────────────────────────
// DIALOGUE
// ─────────────────────────────────────────────
const dlg = { npc:null, lines:[], idx:0, charT:0, cooldown:0 };

function openDlg(npc) {
  state = S.DLG;
  dlg.npc = npc; dlg.lines = npc.dlg; dlg.idx = 0; dlg.charT = 0; dlg.cooldown = 10;
}

function advanceDlg() {
  if (dlg.cooldown > 0) return;
  const fullLen = dlg.lines[dlg.idx][1].length;
  // If text still animating, jump to end first
  if (dlg.charT < fullLen) { dlg.charT = fullLen; return; }
  dlg.idx++;
  if (dlg.idx >= dlg.lines.length) {
    finishDlg();
  } else {
    dlg.charT = 0; dlg.cooldown = 6;
  }
}

function finishDlg() {
  const npc = dlg.npc;
  state = S.OW;
  if (npc.healer) {
    player.mon.hp = player.mon.maxHp;
    setTask("Companion fully healed!");
  }
  if (npc.id === 'SCROLL' && questStep === 0) {
    questStep = 1;
    setTask("Travel east — find the Red Guardian.");
  }
  if (npc.id === 'GUARDIAN' && questStep === 1) {
    startBattle('VOID_DRAKE', true);
    return;
  }
  if (npc.id === 'SCROLL' && questStep >= 2) {
    state = S.WIN;
  }
}

// ─────────────────────────────────────────────
// BATTLE
// ─────────────────────────────────────────────
const ENEMY_DEFS = {
  WILD_BLOT:   new Mon('Wild Blot',    60,  0.8, ['TACKLE','INK_BLOT'],          '#78909c','blob'),
  EMBER_WISP:  new Mon('Ember Wisp',   75,  0.9, ['SPARK','TACKLE'],             '#ffa726','wisp'),
  GLITCH_HOUND:new Mon('Glitch Hound',100,  1.1, ['SHADOW','TACKLE','INK_BLOT'], '#ce93d8','dog'),
  VOID_DRAKE:  new Mon('Void Drake',  180,  1.3, ['VOID_BURN','SHADOW','TACKLE'],'#ef5350','drake'),
};

const B = {
  enemy: null, isBoss: false,
  cursor: 0,
  phase: 'SELECT',   // SELECT | PMSG | ETURN | EMSG | DEAD | PFAINT
  log:'', sub:'',
  flashE:0, flashP:0, shake:0, xpGained:0, lvUp:null,
};

function freshEnemy(key) {
  const d = ENEMY_DEFS[key];
  return new Mon(d.name, d.maxHp, d.atk, d.moves.map(m=>m.name.replace(/ /g,'_').toUpperCase()), d.col, d.shape);
}

// Because Mon constructor takes move keys not names, build a separate clone helper
function cloneMon(key) {
  const src = ENEMY_DEFS[key];
  const m = Object.create(Mon.prototype);
  m.name = src.name; m.maxHp = src.maxHp; m.hp = src.maxHp;
  m.atk = src.atk; m.col = src.col; m.shape = src.shape;
  m.moves = src.moves.map(mv => ({...mv}));
  m.lv = 1; m.xp = 0;
  return m;
}

function startBattle(key, boss=false) {
  state = S.BATTLE;
  B.enemy = cloneMon(key);
  B.isBoss = boss;
  B.cursor = 0;
  B.phase = 'SELECT';
  B.log = `A ${B.enemy.name} appeared!`;
  B.sub = 'Choose a move.';
  B.flashE = B.flashP = B.shake = 0;
}

function playerAttack() {
  const mv = player.mon.moves[B.cursor];
  if (mv.type === 'heal') {
    player.mon.heal(35);
    B.log = `${player.mon.name} used ${mv.name}!`;
    B.sub = 'Restored 35 HP.';
    B.flashP = 8;
    B.phase = 'ETURN';
    return;
  }
  const hit = Math.random()*100 < mv.acc;
  if (hit) {
    const dmg = Math.round(mv.power * player.mon.atk * (0.85 + Math.random()*0.3));
    B.enemy.hp = Math.max(0, B.enemy.hp - dmg);
    B.log = `${player.mon.name} used ${mv.name}!`;
    B.sub = `Dealt ${dmg} damage.`;
    B.shake = 8; B.flashE = 8;
  } else {
    B.log = `${player.mon.name} used ${mv.name}...`;
    B.sub = 'But it missed!';
  }
  if (B.enemy.hp <= 0) {
    const xp = Math.round(B.enemy.maxHp * 0.35 * B.enemy.atk);
    const lu = player.mon.addXP(xp);
    B.xpGained = xp; B.lvUp = lu;
    B.log = `${B.enemy.name} was defeated!`;
    B.sub = lu ? `Gained ${xp} XP — Level Up!` : `Gained ${xp} XP.`;
    B.phase = 'DEAD';
  } else {
    B.phase = 'ETURN';
  }
}

function enemyAttack() {
  const mv = B.enemy.moves[Math.floor(Math.random()*B.enemy.moves.length)];
  const hit = Math.random()*100 < mv.acc;
  if (hit) {
    const dmg = Math.round(mv.power * B.enemy.atk * (0.85 + Math.random()*0.3));
    player.mon.hp = Math.max(0, player.mon.hp - dmg);
    B.log = `${B.enemy.name} used ${mv.name}!`;
    B.sub = `Took ${dmg} damage.`;
    B.shake = 8; B.flashP = 8;
  } else {
    B.log = `${B.enemy.name} used ${mv.name}...`;
    B.sub = 'It missed!';
  }
  B.phase = player.mon.hp <= 0 ? 'PFAINT' : 'EMSG';
  if (B.phase === 'PFAINT') { B.log = `${player.mon.name} fainted!`; B.sub = 'Press Enter to continue...'; }
  if (B.phase === 'EMSG') { B.sub += '  Choose your next move.'; }
}

// ─────────────────────────────────────────────
// HUD
// ─────────────────────────────────────────────
const hudTask  = document.getElementById('hud-task');
const hpFill   = document.getElementById('hpfill');
const hpText   = document.getElementById('hptext');
const pNameEl  = document.getElementById('pname');
function setTask(t) { hudTask.textContent = '▶ ' + t; }
function refreshHUD() {
  const m = player.mon;
  const pct = m.hp / m.maxHp * 100;
  hpFill.style.width = pct + '%';
  hpFill.style.background = pct > 50 ? '#4caf50' : pct > 25 ? '#ffc107' : '#f44336';
  hpText.textContent = `${m.hp}/${m.maxHp}`;
  pNameEl.textContent = `${m.name} Lv${m.lv}`;
}

// ─────────────────────────────────────────────
// CANVAS
// ─────────────────────────────────────────────
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

// ─────────────────────────────────────────────
// DRAWING HELPERS
// ─────────────────────────────────────────────
function drawTile(gx, gy, t) {
  const x = gx*T - cam.x, y = gy*T - cam.y;
  // Base colour
  const cols = ['#2e5c2e','#1c1c2c','#1255a0','#5c3d1e'];
  ctx.fillStyle = cols[t] || '#2e5c2e';
  ctx.fillRect(x, y, T, T);
  // Subtle details
  if (t === 0) { // grass
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(x, y, T, T);
  }
  if (t === 3) { // dirt path
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(x+4, y+10, T-8, 4);
    ctx.fillRect(x+4, y+28, T-8, 4);
  }
  if (t === 2) { // water shimmer
    ctx.fillStyle = `rgba(100,180,255,${0.06 + 0.04*Math.sin(Date.now()/700 + gx)})`;
    ctx.fillRect(x, y, T, T);
  }
  if (t === 1) { // wall
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(x, y, T/2, T/2);
  }
  if (t === 4) { // tall grass — draw on top of base green
    ctx.fillStyle = '#1e4d1e';
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#2d6e2d';
    // blades
    for(let b=0;b<5;b++){
      const bx=x+4+b*9, by=y+T;
      ctx.fillRect(bx, by-18, 3, 18);
      ctx.fillRect(bx-2, by-12, 3, 12);
    }
    ctx.fillStyle='rgba(0,0,0,0.1)';
    ctx.fillRect(x,y,T,T);
  }
}

// Monster sprite renderer
function sprite(x, y, w, h, col, shape, flip) {
  ctx.save();
  if (flip) { ctx.translate(x+w, y); ctx.scale(-1,1); x=0; y=0; }
  ctx.fillStyle = col;
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 1.5;

  if (shape === 'dog') {
    // body
    ctx.beginPath(); ctx.ellipse(x+w*.5,y+h*.58,w*.3,h*.2,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // head
    ctx.beginPath(); ctx.ellipse(x+w*.73,y+h*.38,w*.19,h*.17,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // legs
    [[.24,.7],[.38,.7],[.56,.7],[.7,.7]].forEach(([lx])=>{
      ctx.fillRect(x+w*lx,y+h*.72,w*.1,h*.22);
    });
    // ear
    ctx.beginPath(); ctx.moveTo(x+w*.66,y+h*.23); ctx.lineTo(x+w*.6,y+h*.08); ctx.lineTo(x+w*.74,y+h*.22); ctx.closePath(); ctx.fill();
    // tail
    ctx.lineWidth=3; ctx.strokeStyle=col;
    ctx.beginPath(); ctx.moveTo(x+w*.22,y+h*.52); ctx.quadraticCurveTo(x+w*.04,y+h*.3,x+w*.1,y+h*.18); ctx.stroke();
    // eye
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(x+w*.77,y+h*.36,w*.035,0,Math.PI*2); ctx.fill();
  } else if (shape === 'drake') {
    // wings
    ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(x+w*.42,y+h*.32); ctx.lineTo(x+w*.04,y+h*.1); ctx.lineTo(x+w*.18,y+h*.52); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+w*.58,y+h*.32); ctx.lineTo(x+w*.96,y+h*.1); ctx.lineTo(x+w*.82,y+h*.52); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // body
    ctx.beginPath(); ctx.ellipse(x+w*.5,y+h*.58,w*.27,h*.2,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // neck + head
    ctx.beginPath(); ctx.ellipse(x+w*.5,y+h*.33,w*.14,h*.2,-.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // tail
    ctx.lineWidth=4; ctx.strokeStyle=col;
    ctx.beginPath(); ctx.moveTo(x+w*.76,y+h*.64); ctx.quadraticCurveTo(x+w*.98,y+h*.82,x+w*.88,y+h*.96); ctx.stroke();
    // eye
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+w*.52,y+h*.29,w*.05,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(x+w*.53,y+h*.29,w*.025,0,Math.PI*2); ctx.fill();
  } else if (shape === 'blob') {
    ctx.beginPath(); ctx.arc(x+w/2,y+h/2,w*.37,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+w*.3,y+h*.32,w*.14,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*.7,y+h*.36,w*.11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x+w*.38,y+h*.48,w*.065,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*.62,y+h*.48,w*.065,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(x+w*.4,y+h*.48,w*.03,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*.64,y+h*.48,w*.03,0,Math.PI*2); ctx.fill();
  } else if (shape === 'wisp') {
    for(let r=3;r>0;r--){
      ctx.globalAlpha = 0.18*r;
      ctx.beginPath(); ctx.arc(x+w/2,y+h/2,w*.22*r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(x+w/2,y+h/2,w*.24,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(x+w*.44,y+h*.44,w*.06,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function hpBar(x,y,w,hp,max,label) {
  const pct = Math.max(0,hp/max);
  const col = pct>.5?'#4caf50':pct>.25?'#ffc107':'#f44336';
  ctx.fillStyle='#0a0a14'; ctx.fillRect(x,y,w,10);
  ctx.fillStyle=col; ctx.fillRect(x,y,w*pct,10);
  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,10);
  ctx.fillStyle='#ccc'; ctx.font='14px VT323,monospace';
  ctx.fillText(`${label}  ${hp}/${max}`, x, y-4);
}

function xpBar(x,y,w,mon) {
  const need=mon.lv*60;
  ctx.fillStyle='#111'; ctx.fillRect(x,y,w,5);
  ctx.fillStyle='#7c6af7'; ctx.fillRect(x,y,w*(mon.xp/need),5);
  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,5);
  ctx.fillStyle='#666'; ctx.font='13px VT323,monospace';
  ctx.fillText(`XP ${mon.xp}/${need}  Lv${mon.lv}`, x, y+15);
}

// ─────────────────────────────────────────────
// DRAW OVERWORLD
// ─────────────────────────────────────────────
function drawOW() {
  // visible tile range
  const gx0 = Math.floor(cam.x/T);
  const gy0 = Math.floor(cam.y/T);
  const gx1 = Math.min(COLS, gx0 + Math.ceil(VW/T) + 1);
  const gy1 = Math.min(ROWS, gy0 + Math.ceil(VH/T) + 1);

  for (let gy=gy0; gy<gy1; gy++)
    for (let gx=gx0; gx<gx1; gx++)
      drawTile(gx, gy, MAP[gy][gx]);

  // NPCs
  NPCS.forEach(n => {
    const sx = n.gx*T - cam.x, sy = n.gy*T - cam.y;
    sprite(sx+3, sy+3, T-6, T-6, n.col, 'blob', false);
    // label
    ctx.font='12px VT323,monospace';
    const tw = ctx.measureText(n.label).width;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(sx+T/2-tw/2-2, sy-16, tw+4, 14);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(n.label, sx+T/2, sy-5); ctx.textAlign='left';
  });

  // Player
  sprite(player.gx*T - cam.x + 3, player.gy*T - cam.y + 3, T-6, T-6, '#42a5f5', 'dog', player.dir==='right');

  // Shard indicator
  if (player.mon.hp < player.mon.maxHp && questStep > 0) {
    // small info — skip, don't clutter OW
  }
}

// ─────────────────────────────────────────────
// DRAW DIALOGUE
// ─────────────────────────────────────────────
function drawDlg() {
  drawOW();
  const [speaker, text] = dlg.lines[dlg.idx];
  const visible = text.slice(0, Math.floor(dlg.charT));

  ctx.fillStyle='rgba(6,6,16,.97)';
  ctx.fillRect(20, VH-120, VW-40, 100);
  ctx.strokeStyle='#7c6af7'; ctx.lineWidth=1.5;
  ctx.strokeRect(20, VH-120, VW-40, 100);

  ctx.fillStyle='#7c6af7'; ctx.font='bold 14px VT323,monospace';
  ctx.fillText(speaker.toUpperCase(), 36, VH-96);
  ctx.fillStyle='#e8e8f5'; ctx.font='19px VT323,monospace';
  ctx.fillText(visible, 36, VH-68);

  if (Math.floor(dlg.charT) >= text.length && Math.floor(Date.now()/450)%2===0) {
    ctx.fillStyle='#7c6af7'; ctx.font='15px VT323,monospace';
    ctx.fillText('▼', VW-44, VH-26);
  }
}

// ─────────────────────────────────────────────
// DRAW TITLE
// ─────────────────────────────────────────────
function drawTitle() {
  ctx.fillStyle='#07070f'; ctx.fillRect(0,0,VW,VH);
  // stars
  for(let i=0;i<120;i++){
    const sx=(i*137.5)%VW, sy=(i*93.7)%VH;
    const pulse=0.2+0.4*Math.sin(Date.now()/1000+i*0.7);
    ctx.fillStyle=`rgba(255,255,255,${pulse})`;
    ctx.fillRect(sx,sy,1.5,1.5);
  }
  // floating runes
  const t=Date.now()/1000;
  const runes=['◈','◇','◆','⬡','⬢','✦','✧'];
  for(let i=0;i<7;i++){
    const rx=80+i*100, ry=VH*0.72+Math.sin(t*0.7+i)*18;
    ctx.fillStyle=`rgba(124,106,247,${0.15+0.1*Math.sin(t+i)})`;
    ctx.font='22px VT323,monospace';
    ctx.fillText(runes[i], rx, ry);
  }
  // glow title
  ctx.textAlign='center';
  ctx.shadowColor='#7c6af7'; ctx.shadowBlur=40;
  ctx.fillStyle='#fff'; ctx.font='bold 28px VT323,monospace';
  ctx.fillText("WEAVER'S WAKE", VW/2, 155);
  ctx.shadowBlur=0;
  ctx.fillStyle='#7c6af7'; ctx.font='16px VT323,monospace';
  ctx.fillText('C H R O N I C L E S', VW/2, 182);
  // divider
  ctx.strokeStyle='rgba(124,106,247,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(VW/2-160,200); ctx.lineTo(VW/2+160,200); ctx.stroke();
  // menu options
  const opts = ['► SINGLE PLAYER', '► MULTIPLAYER'];
  opts.forEach((label, i) => {
    const sel = titleCursor===i;
    const oy = 270+i*58;
    if(sel){
      ctx.fillStyle='rgba(124,106,247,0.18)';
      ctx.fillRect(VW/2-140, oy-28, 280, 42);
      ctx.strokeStyle='#7c6af7'; ctx.lineWidth=1;
      ctx.strokeRect(VW/2-140, oy-28, 280, 42);
    }
    ctx.fillStyle = sel?'#fff':'#555577';
    ctx.font=`${sel?22:19}px VT323,monospace`;
    ctx.fillText(label, VW/2, oy);
  });
  ctx.fillStyle='#333355'; ctx.font='14px VT323,monospace';
  ctx.fillText('W / S or ↑ ↓ to select   ·   Enter or Space to confirm', VW/2, 430);
  ctx.textAlign='left';
}

// ─────────────────────────────────────────────
// DRAW MULTIPLAYER SCREEN
// ─────────────────────────────────────────────
function drawMP() {
  ctx.fillStyle='#07070f'; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<80;i++){
    const sx=(i*191.3)%VW, sy=(i*113.7)%VH;
    ctx.fillStyle=`rgba(255,255,255,${0.1+0.15*Math.sin(Date.now()/800+i)})`;
    ctx.fillRect(sx,sy,1.5,1.5);
  }
  ctx.textAlign='center';
  ctx.shadowColor='#e040fb'; ctx.shadowBlur=30;
  ctx.fillStyle='#e8e8f5'; ctx.font='bold 22px VT323,monospace';
  ctx.fillText('MULTIPLAYER', VW/2, 180);
  ctx.shadowBlur=0;
  ctx.fillStyle='#555577'; ctx.font='20px VT323,monospace';
  ctx.fillText('Coming Soon', VW/2, 230);
  ctx.fillStyle='#333350'; ctx.font='17px VT323,monospace';
  ctx.fillText('Online co-op and PvP battles are in development.', VW/2, 290);
  ctx.fillText('Check back in a future update!', VW/2, 316);
  const blink=Math.floor(Date.now()/600)%2===0;
  if(blink){ ctx.fillStyle='#7c6af7'; ctx.font='15px VT323,monospace'; ctx.fillText('[ Press Enter or ESC to go back ]', VW/2, 400); }
  ctx.textAlign='left';
}

// ─────────────────────────────────────────────
// DRAW LEVEL UP
// ─────────────────────────────────────────────
function drawLevelUp() {
  drawOW();
  const d = lvUpData;
  // overlay
  ctx.fillStyle='rgba(6,6,18,0.88)'; ctx.fillRect(0,0,VW,VH);
  // box
  const bx=VW/2-180, by=VH/2-120, bw=360, bh=240;
  ctx.fillStyle='#0e0e1e'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
  // inner accent line
  ctx.strokeStyle='rgba(124,106,247,0.3)'; ctx.lineWidth=1;
  ctx.strokeRect(bx+4,by+4,bw-8,bh-8);
  ctx.textAlign='center';
  // star burst glow
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
  ctx.fillStyle='#ffd700'; ctx.font='bold 22px VT323,monospace';
  ctx.fillText('✦  LEVEL UP!  ✦', VW/2, by+44);
  ctx.shadowBlur=0;
  ctx.fillStyle='#e8e8f5'; ctx.font='19px VT323,monospace';
  ctx.fillText(`${player.mon.name}`, VW/2, by+80);
  ctx.fillStyle='#7c6af7'; ctx.font='17px VT323,monospace';
  ctx.fillText(`Lv ${d.oldLv}  →  Lv ${d.newLv}`, VW/2, by+108);
  // stats gained
  ctx.fillStyle='#4caf50'; ctx.font='16px VT323,monospace';
  ctx.fillText(`Max HP  +${d.hpGain}  (now ${player.mon.maxHp})`, VW/2, by+142);
  ctx.fillStyle='#ffd54f';
  ctx.fillText(`Attack  +0.05  (now ${player.mon.atk.toFixed(2)})`, VW/2, by+165);
  const blink=Math.floor(Date.now()/500)%2===0;
  if(blink){ ctx.fillStyle='#555577'; ctx.font='14px VT323,monospace'; ctx.fillText('[ Press Space or Enter ]', VW/2, by+208); }
  ctx.textAlign='left';
}

// ─────────────────────────────────────────────
// DRAW BATTLE
// ─────────────────────────────────────────────
function drawBattle() {
  // BG
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#0c0c1a'); g.addColorStop(1,'#190a1a');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  // subtle grid
  ctx.strokeStyle='rgba(124,106,247,.04)';
  for(let i=0;i<VW;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,VH);ctx.stroke();}
  for(let i=0;i<VH;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(VW,i);ctx.stroke();}

  const sx = B.shake>0?(Math.random()-.5)*5:0;
  ctx.save(); ctx.translate(sx,0);

  // Enemy
  const ea = B.flashE>0 && Math.floor(B.flashE/2)%2===0 ? .25 : 1;
  ctx.globalAlpha=ea;
  sprite(450, 55, 190, 155, B.enemy.col, B.enemy.shape, false);
  ctx.globalAlpha=1;
  hpBar(450, 220, 200, B.enemy.hp, B.enemy.maxHp, B.enemy.name);

  // Player
  const pa = B.flashP>0 && Math.floor(B.flashP/2)%2===0 ? .25 : 1;
  ctx.globalAlpha=pa;
  sprite(110, 190, 170, 135, player.mon.col, player.mon.shape, true);
  ctx.globalAlpha=1;
  hpBar(40, 345, 220, player.mon.hp, player.mon.maxHp, player.mon.name);
  xpBar(40, 362, 220, player.mon);

  ctx.restore();

  // Battle panel
  ctx.fillStyle='#08080f'; ctx.fillRect(0, 395, VW, VH-395);
  ctx.strokeStyle='#222238'; ctx.lineWidth=1; ctx.strokeRect(0, 395, VW, VH-395);

  if (B.phase === 'SELECT') {
    const moves = player.mon.moves;
    moves.forEach((mv, i) => {
      const cx = 50 + (i%2)*310, cy = 418 + Math.floor(i/2)*70;
      const sel = B.cursor===i;
      ctx.fillStyle = sel?'rgba(124,106,247,.16)':'rgba(255,255,255,.03)';
      ctx.fillRect(cx-6,cy-20,280,52);
      if(sel){ctx.strokeStyle='#7c6af7';ctx.lineWidth=1;ctx.strokeRect(cx-6,cy-20,280,52);}
      ctx.fillStyle = sel?'#fff':'#8888aa'; ctx.font='18px VT323,monospace';
      ctx.fillText((sel?'▶ ':'')+mv.name, cx, cy);
      ctx.fillStyle=MTYPE_COL[mv.type]||'#888'; ctx.font='14px VT323,monospace';
      const pwrTxt = mv.type==='heal' ? 'HEAL  '+mv.desc : mv.type.toUpperCase()+'  PWR:'+mv.power+'  '+mv.desc;
      ctx.fillText(pwrTxt, cx, cy+17);
    });
    if (!B.isBoss) {
      ctx.fillStyle='#44444a'; ctx.font='14px VT323,monospace';
      ctx.fillText('[ESC] Run', VW-90, VH-8);
    }
  } else {
    ctx.fillStyle='#e8e8f5'; ctx.font='21px VT323,monospace';
    ctx.fillText(B.log, 40, 442);
    ctx.fillStyle='#8888aa'; ctx.font='17px VT323,monospace';
    ctx.fillText(B.sub, 40, 468);
    const blink = Math.floor(Date.now()/480)%2===0;
    if (blink) {
      ctx.fillStyle='#7c6af7'; ctx.font='15px VT323,monospace';
      ctx.fillText('▼ Press Space / Enter', VW-220, VH-10);
    }
  }
}

// ─────────────────────────────────────────────
// DRAW WIN
// ─────────────────────────────────────────────
function drawWin() {
  ctx.fillStyle='#08080f'; ctx.fillRect(0,0,VW,VH);
  // stars
  for(let i=0;i<100;i++){
    const sx=(i*137.5)%VW, sy=(i*179.3)%VH;
    ctx.fillStyle=`rgba(255,255,255,${.15+.35*Math.sin(Date.now()/900+i)})`;
    ctx.fillRect(sx,sy,1.5,1.5);
  }
  ctx.textAlign='center';
  ctx.shadowColor='#7c6af7'; ctx.shadowBlur=24;
  ctx.fillStyle='#e8e8f5'; ctx.font='bold 13px VT323,monospace';
  ctx.fillText('THE WEAVE IS RESTORED', VW/2, 180);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffd700'; ctx.font='22px VT323,monospace';
  ctx.fillText('You defeated the Void Drake and recovered the Loom Shard.', VW/2, 244);
  ctx.fillText('Reality holds — for now.', VW/2, 272);
  ctx.fillStyle='#9090b0'; ctx.font='17px VT323,monospace';
  ctx.fillText(`${player.mon.name}  Lv${player.mon.lv}  ·  Journey complete`, VW/2, 320);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='15px VT323,monospace';
  ctx.fillText('[ Refresh to play again ]', VW/2, 420);
  ctx.textAlign='left';
}

// ─────────────────────────────────────────────
// MINIMAP
// ─────────────────────────────────────────────
function drawMinimap() {
  const mw=108, mh=84, ox=VW-mw-8, oy=8, s=mw/COLS;
  ctx.fillStyle='rgba(6,6,18,.82)'; ctx.fillRect(ox,oy,mw,mh);
  for(let gy=0;gy<ROWS;gy++)
    for(let gx=0;gx<COLS;gx++){
      const t=MAP[gy][gx];
      ctx.fillStyle=t===1?'#1a1a28':t===2?'#1255a0':t===3?'#5c3d1e':'#2e5c2e';
      ctx.fillRect(ox+gx*s, oy+gy*s, s-.5, s-.5);
    }
  NPCS.forEach(n=>{
    ctx.fillStyle=n.col;
    ctx.fillRect(ox+n.gx*s-1,oy+n.gy*s-1,3,3);
  });
  ctx.fillStyle='#fff'; ctx.fillRect(ox+player.gx*s-1.5,oy+player.gy*s-1.5,3,3);
  ctx.strokeStyle='rgba(124,106,247,.4)'; ctx.lineWidth=1; ctx.strokeRect(ox,oy,mw,mh);
}

// ─────────────────────────────────────────────
// UPDATE
// ─────────────────────────────────────────────
function update() {
  if (state === S.TITLE) {
    if(trigAny('ArrowUp','w')) titleCursor=0;
    if(trigAny('ArrowDown','s')) titleCursor=1;
    if(trigAny('Enter',' ')){
      if(titleCursor===0){ state=S.OW; updateCam(); refreshHUD(); }
      else { state=S.MP; }
    }
    return;
  }
  if (state === S.MP) {
    if(trigAny('Enter',' ','Escape')) state=S.TITLE;
    return;
  }
  if (state === S.LEVELUP) {
    if(trigAny('Enter',' ')){ lvUpData=null; state=S.OW; }
    return;
  }
  if (state === S.WIN) return;

  if (state === S.OW) {
    let dx=0, dy=0;
    if      (trigAny('ArrowUp','w'))    { dy=-1; player.dir='up'; }
    else if (trigAny('ArrowDown','s'))  { dy= 1; player.dir='down'; }
    else if (trigAny('ArrowLeft','a'))  { dx=-1; player.dir='left'; }
    else if (trigAny('ArrowRight','d')) { dx= 1; player.dir='right'; }

    if (dx||dy) {
      const nx=player.gx+dx, ny=player.gy+dy;
      if (walkable(nx,ny)) {
        player.gx=nx; player.gy=ny;
        updateCam();
        if (MAP[ny][nx]===4 && Math.random()<.15) {
          const wilds=['WILD_BLOT','EMBER_WISP','GLITCH_HOUND'];
          startBattle(wilds[Math.floor(Math.random()*3)], false);
        }
      }
    }

    if (trigAny('Enter',' ')) {
      const adj=[{gx:player.gx,gy:player.gy},{gx:player.gx,gy:player.gy-1},{gx:player.gx,gy:player.gy+1},{gx:player.gx-1,gy:player.gy},{gx:player.gx+1,gy:player.gy}];
      const npc=NPCS.find(n=>adj.some(c=>c.gx===n.gx&&c.gy===n.gy));
      if(npc) openDlg(npc);
    }

  } else if (state === S.DLG) {
    if(dlg.cooldown>0) dlg.cooldown--;
    dlg.charT = Math.min(dlg.charT + 1.8, dlg.lines[dlg.idx][1].length);
    if (trigAny('Enter',' ')) advanceDlg();

  } else if (state === S.BATTLE) {
    if(B.shake>0) B.shake--;
    if(B.flashE>0) B.flashE--;
    if(B.flashP>0) B.flashP--;

    if (B.phase==='SELECT') {
      if(trigAny('ArrowUp','w','ArrowLeft','a'))   B.cursor=(B.cursor-1+player.mon.moves.length)%player.mon.moves.length;
      if(trigAny('ArrowDown','s','ArrowRight','d')) B.cursor=(B.cursor+1)%player.mon.moves.length;
      if(trigAny('Enter',' ')) playerAttack();
      if(trig('Escape')&&!B.isBoss){
        if(Math.random()<.5){ state=S.OW; setTask("Got away!"); }
        else { B.log="Couldn't escape!"; B.sub=''; B.phase='ETURN'; }
      }
    } else if (B.phase==='PMSG'||B.phase==='ETURN') {
      if(trigAny('Enter',' ')) enemyAttack();
    } else if (B.phase==='EMSG') {
      if(trigAny('Enter',' ')){ B.phase='SELECT'; B.log=''; B.sub='Choose a move.'; }
    } else if (B.phase==='DEAD') {
      if(trigAny('Enter',' ')){
        if(B.isBoss){
          questStep=2;
          const sc=NPCS.find(n=>n.id==='SCROLL');
          sc.dlg=[
            ["Elder Scroll","You've done it, Weaver."],
            ["Elder Scroll","The Loom Shard pulses with recovered light."],
            ["Elder Scroll","The Canvas stabilises. The world is saved."],
            ["Elder Scroll","Rest — the Weave will remember your name."],
          ];
          setTask("Return to the Elder Scroll!");
        }
        if(B.lvUp){ lvUpData = B.lvUp; state=S.LEVELUP; }
        else { state=S.OW; }
      }
    } else if (B.phase==='PFAINT') {
      if(trigAny('Enter',' ')){
        player.mon.hp=Math.floor(player.mon.maxHp*.35);
        state=S.OW;
        setTask("Defeated... recover and try again.");
      }
    }
  }

  refreshHUD();
}

// ─────────────────────────────────────────────
// DRAW
// ─────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,VW,VH);
  if(state===S.TITLE)      { drawTitle(); }
  else if(state===S.MP)    { drawMP(); }
  else if(state===S.WIN)   { drawWin(); }
  else if(state===S.OW)    { drawOW(); drawMinimap(); }
  else if(state===S.DLG)   { drawDlg(); drawMinimap(); }
  else if(state===S.BATTLE){ drawBattle(); }
  else if(state===S.LEVELUP){ drawLevelUp(); }
}

// ─────────────────────────────────────────────
// LOOP
// ─────────────────────────────────────────────
function loop() {
  update();
  draw();
  flushInput();
  requestAnimationFrame(loop);
}

loop();
</script>
