<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Hoops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111827; /* Gray 900 */
            overflow: hidden;
            touch-action: none; /* Prevent scroll/zoom on mobile */
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        canvas {
            background: linear-gradient(to bottom, #1f2937, #111827); /* Gray 800 to 900 */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- The internal logical resolution is 400x600, scaled automatically by CSS -->
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
/**
 * AUDIO SYNTHESIS ENGINE
 * Generates retro sound effects dynamically without external files.
 */
const AudioEngine = (function() {
    let ctx = null;

    function init() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') {
            ctx.resume();
        }
    }

    function playTone(freq, type, duration, vol=0.1, slideFreq=null) {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
       
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);
        }

        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    }

    return {
        init,
        jump: () => playTone(250, 'sine', 0.15, 0.1, 400),
        bounce: () => playTone(150, 'triangle', 0.1, 0.05),
        rim: () => playTone(400, 'square', 0.05, 0.02, 300),
        score: () => {
            playTone(523.25, 'sine', 0.3, 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.4, 0.1), 100); // E5
        },
        swish: () => {
            playTone(523.25, 'square', 0.3, 0.1);
            setTimeout(() => playTone(659.25, 'square', 0.3, 0.1), 100);
            setTimeout(() => playTone(783.99, 'square', 0.4, 0.1), 200); // G5
        },
        gameover: () => {
            playTone(300, 'sawtooth', 0.5, 0.1, 100);
        }
    };
})();

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const WIDTH = canvas.width;
const HEIGHT = canvas.height;

// Game State
let state = 'START'; // START, PLAY, OVER
let score = 0;
let highScore = localStorage.getItem('taptap_hscore') || 0;
let lastTime = 0;
let shakeAmount = 0;
let scoreFlash = 0;
let swishStreak = 0;

// Physics Constants
const GRAVITY = 0.35;
const JUMP_FORCE = -7.5;
const MOVE_SPEED = 2.8;

// Time system
const MAX_TIME = 8000; // 8 seconds per shot
let timeLeft = MAX_TIME;

// Entities
let ball;
let hoop;
let particles = [];
let texts = [];

class Ball {
    constructor() {
        this.r = 14;
        this.reset();
    }

    reset() {
        this.x = WIDTH / 2;
        this.y = HEIGHT / 2;
        this.vx = MOVE_SPEED;
        this.vy = 0;
        this.prevX = this.x;
        this.prevY = this.y;
        this.rotation = 0;
        this.touchedRim = false;
        this.history = [];
    }

    jump() {
        this.vy = JUMP_FORCE;
        AudioEngine.jump();
    }

    update() {
        this.prevX = this.x;
        this.prevY = this.y;

        this.history.unshift({x: this.x, y: this.y});
        if (this.history.length > 15) this.history.pop();

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
       
        // Spin calculation
        this.rotation += this.vx * 0.05;

        // Wall collisions
        if (this.x - this.r < 0) {
            this.x = this.r;
            this.vx = Math.abs(this.vx);
            AudioEngine.bounce();
        } else if (this.x + this.r > WIDTH) {
            this.x = WIDTH - this.r;
            this.vx = -Math.abs(this.vx);
            AudioEngine.bounce();
        }

        // Ceiling bounce
        if (this.y - this.r < 0) {
            this.y = this.r;
            this.vy = Math.abs(this.vy) * 0.5;
        }

        // Game Over condition
        if (this.y - this.r > HEIGHT) {
            triggerGameOver();
        }
    }

    draw(ctx) {
        // Draw Trail
        if (this.history.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) {
                ctx.lineTo(this.history[i].x, this.history[i].y);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = this.r * 1.2;
           
            // Fire trail if streak >= 2
            if (swishStreak >= 2) {
                let grad = ctx.createLinearGradient(this.x, this.y, this.history[this.history.length-1].x, this.history[this.history.length-1].y);
                grad.addColorStop(0, 'rgba(239, 68, 68, 0.8)'); // red-500
                grad.addColorStop(0.5, 'rgba(245, 158, 11, 0.4)'); // amber-500
                grad.addColorStop(1, 'rgba(252, 211, 77, 0)'); // amber-300
                ctx.strokeStyle = grad;
            } else {
                ctx.strokeStyle = 'rgba(249, 115, 22, 0.2)'; // default orange trail
            }
            ctx.stroke();
        }

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Ball base
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316'; // Tailwind orange-500
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#9a3412'; // Tailwind orange-800
        ctx.stroke();

        // Cross lines
        ctx.beginPath();
        ctx.moveTo(0, -this.r);
        ctx.lineTo(0, this.r);
        ctx.moveTo(-this.r, 0);
        ctx.lineTo(this.r, 0);
        ctx.stroke();

        // Curves
        ctx.beginPath();
        ctx.arc(-this.r*0.6, 0, this.r*0.8, -Math.PI/2.5, Math.PI/2.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(this.r*0.6, 0, this.r*0.8, Math.PI - Math.PI/2.5, Math.PI + Math.PI/2.5);
        ctx.stroke();

        ctx.restore();
    }
}

class Hoop {
    constructor() {
        this.side = 1; // 1 = right, -1 = left
        this.spawn();
    }

    spawn() {
        this.side *= -1; // Flip side
        // Randomize Y between 200 and 450
        this.y = 200 + Math.random() * 250;
       
        // Fixed X based on side
        const padding = 70;
        this.x = this.side === 1 ? WIDTH - padding : padding;
       
        this.rimRadius = 22;
        this.rimNodes = [
            { x: this.x - this.rimRadius, y: this.y, r: 3 }, // Left rim
            { x: this.x + this.rimRadius, y: this.y, r: 3 }  // Right rim
        ];
       
        this.backboard = {
            w: 8,
            h: 70,
            x: this.side === 1 ? this.x + 35 : this.x - 35 - 8,
            y: this.y - 50
        };
    }

    checkCollisions(ball) {
        // 1. Backboard collision
        const bb = this.backboard;
        // Simple AABB vs Circle logic
        let testX = ball.x;
        let testY = ball.y;
       
        if (ball.x < bb.x) testX = bb.x;
        else if (ball.x > bb.x + bb.w) testX = bb.x + bb.w;
        if (ball.y < bb.y) testY = bb.y;
        else if (ball.y > bb.y + bb.h) testY = bb.y + bb.h;

        let distX = ball.x - testX;
        let distY = ball.y - testY;
        let distance = Math.sqrt((distX*distX) + (distY*distY));

        if (distance <= ball.r) {
            ball.touchedRim = true;
            // Determine bounce direction
            if (ball.x < bb.x || ball.x > bb.x + bb.w) {
                ball.vx *= -0.8;
                ball.x = ball.x < bb.x ? bb.x - ball.r : bb.x + bb.w + ball.r;
            } else {
                ball.vy *= -0.8;
                ball.y = ball.y < bb.y ? bb.y - ball.r : bb.y + bb.h + ball.r;
            }
            AudioEngine.bounce();
        }

        // 2. Rim points collision
        for (let node of this.rimNodes) {
            let dx = ball.x - node.x;
            let dy = ball.y - node.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
           
            if (dist < ball.r + node.r) {
                ball.touchedRim = true;
               
                // Push out
                let overlap = (ball.r + node.r) - dist;
                let nx = dx / dist;
                let ny = dy / dist;
                ball.x += nx * overlap;
                ball.y += ny * overlap;

                // Bounce velocity
                let dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) { // Only bounce if moving towards the node
                    ball.vx -= 1.6 * dot * nx;
                    ball.vy -= 1.6 * dot * ny;
                    AudioEngine.rim();
                    shakeAmount = 3;
                    swishStreak = 0;
                }
            }
        }

        // 3. Scoring Detection
        // Must pass downward through the line segment between the two rim nodes
        let scoreLineStart = this.rimNodes[0];
        let scoreLineEnd = this.rimNodes[1];
       
        if (ball.vy > 0) { // Moving down
            if (linesIntersect(
                {x: ball.prevX, y: ball.prevY}, {x: ball.x, y: ball.y},
                scoreLineStart, scoreLineEnd
            )) {
                triggerScore();
            }
        }
    }

    draw(ctx) {
        // Backboard
        ctx.fillStyle = '#f8fafc'; // slate-50
        ctx.fillRect(this.backboard.x, this.backboard.y, this.backboard.w, this.backboard.h);
        // Red square on backboard
        ctx.strokeStyle = '#ef4444'; // red-500
        ctx.lineWidth = 2;
        let squareX = this.side === 1 ? this.backboard.x - 4 : this.backboard.x + this.backboard.w;
        ctx.strokeRect(this.side===1 ? squareX-6 : squareX, this.y - 20, 10, 20);

        // Net (Draw first so ball can pass "in front")
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.rimNodes[0].x, this.rimNodes[0].y);
        ctx.lineTo(this.x - 12, this.y + 40);
        ctx.lineTo(this.x + 12, this.y + 40);
        ctx.lineTo(this.rimNodes[1].x, this.rimNodes[1].y);
       
        ctx.moveTo(this.x - 18, this.y + 15);
        ctx.lineTo(this.x + 18, this.y + 15);
        ctx.moveTo(this.x - 14, this.y + 30);
        ctx.lineTo(this.x + 14, this.y + 30);
        ctx.stroke();

        // Rim nodes (front)
        ctx.fillStyle = '#ea580c'; // orange-600
        for (let node of this.rimNodes) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
            ctx.fill();
        }
       
        // Rim line
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.rimNodes[0].x, this.rimNodes[0].y);
        ctx.lineTo(this.rimNodes[1].x, this.rimNodes[1].y);
        ctx.stroke();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.life = 1.0;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // slight gravity
        this.life -= 0.03;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class TextEffect {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1.0;
        this.vy = -1.5;
    }
    update() {
        this.y += this.vy;
        this.life -= 0.02;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

// Utility: Line intersection
function linesIntersect(p1, p2, p3, p4) {
    let det, gamma, lambda;
    det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y);
    if (det === 0) return false;
    lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p1.x - p4.x) * (p4.y - p1.y)) / det;
    gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;
    return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
}

function spawnParticles(x, y, isSwish) {
    const colors = isSwish
        ? (swishStreak >= 2 ? ['#ef4444', '#f97316', '#fcd34d'] : ['#fbbf24', '#f59e0b', '#fff'])
        : ['#f97316', '#ea580c', '#fff'];
    const count = isSwish ? 35 : 15;
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
}

function triggerScore() {
    let isSwish = !ball.touchedRim;
    let points = isSwish ? 2 : 1;
    score += points;
    scoreFlash = 1.0;
    shakeAmount = isSwish ? 8 : 4;
   
    if (isSwish) {
        swishStreak++;
        AudioEngine.swish();
        let msg = swishStreak >= 3 ? "ON FIRE! +2" : "SWISH! +2";
        texts.push(new TextEffect(hoop.x, hoop.y - 30, msg, "#fbbf24"));
    } else {
        swishStreak = 0;
        AudioEngine.score();
        texts.push(new TextEffect(hoop.x, hoop.y - 30, "+1", "#fff"));
    }

    spawnParticles(hoop.x, hoop.y, isSwish);
   
    // Reset timer, spawn new hoop
    timeLeft = MAX_TIME;
    hoop.spawn();
    ball.touchedRim = false;
}

function triggerGameOver() {
    state = 'OVER';
    shakeAmount = 12;
    swishStreak = 0;
    AudioEngine.gameover();
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('taptap_hscore', highScore);
    }
}

function initGame() {
    ball = new Ball();
    hoop = new Hoop();
    // Ensure hoop spawns nicely for the first shot
    hoop.side = 1;
    hoop.x = WIDTH - 70;
    hoop.y = HEIGHT / 2;
    hoop.rimNodes = [
        { x: hoop.x - 22, y: hoop.y, r: 3 },
        { x: hoop.x + 22, y: hoop.y, r: 3 }
    ];
    hoop.backboard.x = hoop.x + 35;
    hoop.backboard.y = hoop.y - 50;

    particles = [];
    texts = [];
    score = 0;
    swishStreak = 0;
    timeLeft = MAX_TIME;
    state = 'PLAY';
    ball.jump(); // initial jump to start moving
}

function handleInput() {
    AudioEngine.init(); // Must be triggered on user action
   
    if (state === 'START' || state === 'OVER') {
        initGame();
    } else if (state === 'PLAY') {
        ball.jump();
    }
}

// Event Listeners
window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Prevent double tap zoom
    handleInput();
}, { passive: false });

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
});

// Main Loop
function update(dt) {
    if (state === 'PLAY') {
        timeLeft -= dt;
        if (timeLeft <= 0) {
            triggerGameOver();
        }

        ball.update();
        hoop.checkCollisions(ball);

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = texts.length - 1; i >= 0; i--) {
            texts[i].update();
            if (texts[i].life <= 0) texts.splice(i, 1);
        }
    }
}

function draw() {
    // Background clear
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    ctx.save();
    // Screen Shake Effect
    if (shakeAmount > 0.5) {
        ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        shakeAmount *= 0.85; // Decay
    }

    // Draw Score Background
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.font = 'bold 180px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state === 'PLAY' ? score : (state==='START'?'0':score), WIDTH / 2, HEIGHT / 2);

    if (state === 'START') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Arial';
        ctx.fillText('TAP TAP HOOPS', WIDTH / 2, HEIGHT / 3);
        ctx.font = '20px Arial';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('Tap to keep the ball in the air.', WIDTH / 2, HEIGHT / 2 + 80);
        ctx.fillText('Score before time runs out!', WIDTH / 2, HEIGHT / 2 + 110);
       
        // Blink tap to start
        if (Math.floor(Date.now() / 500) % 2 === 0) {
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('TAP TO START', WIDTH / 2, HEIGHT - 100);
        }
    }
    else if (state === 'PLAY' || state === 'OVER') {
        // Draw Game Entities
        hoop.draw(ctx);
        ball.draw(ctx);
        particles.forEach(p => p.draw(ctx));
        texts.forEach(t => t.draw(ctx));

        // Draw Timer Bar
        if (state === 'PLAY') {
            let barWidth = (Math.max(0, timeLeft) / MAX_TIME) * WIDTH;
            ctx.fillStyle = (timeLeft / MAX_TIME) > 0.3 ? '#22c55e' : '#ef4444'; // Green or Red
            ctx.fillRect(0, 0, barWidth, 6);
        }
       
        // Draw Active Score Text Top Left
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(score, 20, 20);

        // Draw Fire status
        if (swishStreak >= 2) {
            ctx.fillStyle = '#ef4444'; // Red
            ctx.font = 'bold 20px Arial';
            ctx.fillText('🔥 ON FIRE!', 20, 60);
        }

        if (state === 'OVER') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
           
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAME OVER', WIDTH / 2, HEIGHT / 3);
           
            ctx.fillStyle = '#fff';
            ctx.font = '24px Arial';
            ctx.fillText(`Score: ${score}`, WIDTH / 2, HEIGHT / 2);
            ctx.fillText(`Best: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 40);

            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('TAP TO RESTART', WIDTH / 2, HEIGHT - 100);
            }
        }
    }

    // Score Flash Effect
    if (scoreFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${scoreFlash * 0.3})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        scoreFlash -= 0.05;
    }

    ctx.restore();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
   
    // Cap delta time to prevent physics explosions on lag
    if (dt > 50) dt = 50;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

// Start
requestAnimationFrame(loop);

</script>
</body>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wall Bounce Bird</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            touch-action: none; /* Prevent scroll on touch */

            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; /* Keep it mobile-proportioned on desktop */

            display: block;

            flex-direction: column;

            position: absolute;
            top: 50%;
            left: 50%;

            font-weight: bold;
            color: rgba(255, 255, 255, 0.05);
            z-index: 0;
            pointer-events: none;
        }
        #start-screen, #game-over-screen {
            pointer-events: auto; /* Catch clicks on buttons */
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Big background score -->
    <div id="bg-score" class="score-bg">0</div>
   
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="ui-layer bg-black/60 backdrop-blur-sm transition-opacity duration-300">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-2 text-center shadow-lg tracking-wider">WALL BIRD</h1>
        <p class="text-gray-300 mb-8 text-center px-4">Flap through the gaps.<br>Bounce off the walls.</p>
        <button id="start-btn" class="px-8 py-3 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-bold rounded-full text-xl shadow-[0_4px_0_rgb(159,18,57)] transition-transform active:translate-y-1 active:shadow-none">
            TAP TO START
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="ui-layer bg-black/70 backdrop-blur-md opacity-0 hidden transition-opacity duration-300">
        <h2 class="text-5xl font-extrabold text-white mb-2 text-center drop-shadow-lg">GAME OVER</h2>
        <div class="bg-white/10 rounded-2xl p-6 mb-8 backdrop-blur-sm border border-white/20 text-center min-w-[250px]">
            <p class="text-gray-300 text-sm uppercase tracking-widest mb-1">Score</p>
            <p id="final-score" class="text-6xl font-bold text-rose-400 mb-4">0</p>
            <p class="text-gray-300 text-sm uppercase tracking-widest mb-1">Best</p>
            <p id="best-score" class="text-3xl font-bold text-white">0</p>
        </div>
        <button id="restart-btn" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-full text-xl shadow-[0_4px_0_rgb(6,95,70)] transition-transform active:translate-y-1 active:shadow-none">
            PLAY AGAIN
        </button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
   
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const bgScore = document.getElementById('bg-score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Game Constants & Variables
    let GAME_WIDTH = 400;
    let GAME_HEIGHT = 600;
   
    const GRAVITY = 0.3; // Lowered from 0.5 for a floatier feel
    const FLAP_STRENGTH = -6; // Adjusted to match the new gravity
    const MAX_FALL_SPEED = 9; // Lowered from 12 so you don't drop like a rock
    const HORIZONTAL_SPEED = 4.5;
    const BIRD_RADIUS = 15;
    const PIPE_WIDTH = 45;
    let GAP_SIZE = 140; // Will shrink slightly as score increases
    const MIN_GAP_MARGIN = 100; // Minimum distance from top/bottom for a gap

    // Colors
    const COLOR_BIRD = '#f43f5e'; // Rose 500
    const COLOR_BIRD_OUTLINE = '#be123c';
    const COLOR_PIPE = '#10b981'; // Emerald 500
    const COLOR_PIPE_DARK = '#047857';
    const COLOR_PIPE_CAP = '#34d399';
   
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let bestScore = localStorage.getItem('wallBirdBest') || 0;
   
    let bird = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        rotation: 0
    };

    let walls = {
        left: { gapY: 0, active: false },
        right: { gapY: 0, active: false }
    };

    let particles = [];

    // --- NEW VARIABLES FOR JUICE ---
    let trail = [];
    let frameCount = 0;
   
    // Simple Web Audio API Synthesizer for Retro Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
       
        if (type === 'flap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'score') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }
    // -------------------------------

    // Setup Canvas Resolution
    function resizeCanvas() {
        // High DPI support
        const dpr = window.devicePixelRatio || 1;
        const rect = container.getBoundingClientRect();
       
        GAME_WIDTH = rect.width;
        GAME_HEIGHT = rect.height;
       
        canvas.width = GAME_WIDTH * dpr;
        canvas.height = GAME_HEIGHT * dpr;
       
        ctx.scale(dpr, dpr);
        canvas.style.width = `${GAME_WIDTH}px`;
        canvas.style.height = `${GAME_HEIGHT}px`;

        if (gameState === 'START') {
            resetGamePositions();
            draw(); // Redraw initial state
        }
    }

    window.addEventListener('resize', resizeCanvas);

    // Initialize Game
    function init() {
        bestScoreEl.innerText = bestScore;
        resizeCanvas();
        resetGamePositions();
       
        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
        });
       
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent double firing
            handleInput();
        }, { passive: false });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        requestAnimationFrame(gameLoop);
    }

    function resetGamePositions() {
        bird.x = GAME_WIDTH / 2;
        bird.y = GAME_HEIGHT / 2;
        bird.vy = 0;
        bird.vx = HORIZONTAL_SPEED; // Start moving right
        bird.rotation = 0;
       
        score = 0;
        GAP_SIZE = 140;
        bgScore.innerText = '0';
        particles = [];
        trail = [];

        // Right wall is the first target, left wall is closed (no gap needed yet, but we'll put one off-screen or safe)
        walls.right.gapY = getRandomGapY();
        walls.right.active = true;
       
        walls.left.gapY = GAME_HEIGHT / 2; // Safe starting gap on the left so we don't spawn inside a wall
        walls.left.active = false; // Not actively checking score collision until we bounce
    }

    function getRandomGapY() {
        const min = MIN_GAP_MARGIN + GAP_SIZE / 2;
        const max = GAME_HEIGHT - MIN_GAP_MARGIN - GAP_SIZE / 2;
        return Math.random() * (max - min) + min;
    }

    function startGame() {
        if (gameState === 'PLAYING') return;
       
        resetGamePositions();
        gameState = 'PLAYING';
       
        startScreen.classList.add('opacity-0');
        setTimeout(() => startScreen.classList.add('hidden'), 300);
       
        gameOverScreen.classList.add('opacity-0');
        setTimeout(() => gameOverScreen.classList.add('hidden'), 300);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        createExplosion(bird.x, bird.y, COLOR_BIRD, 30);
        playSound('hit');
       
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('wallBirdBest', bestScore);
        }
       
        finalScoreEl.innerText = score;
        bestScoreEl.innerText = bestScore;
       
        gameOverScreen.classList.remove('hidden');
        // Small delay before fading in to allow explosion to be seen
        setTimeout(() => {
            gameOverScreen.classList.remove('opacity-0');
        }, 100);
    }

    function handleInput() {
        if (gameState === 'START') {
            startGame();
        } else if (gameState === 'PLAYING') {
            flap();
        }
    }

    function flap() {
        bird.vy = FLAP_STRENGTH;
        createParticles(bird.x, bird.y + BIRD_RADIUS, 5); // Flap dust
        playSound('flap');
    }

    // --- Core Game Logic ---

    function update() {
        if (gameState !== 'PLAYING') return;

        // Physics
        bird.vy += GRAVITY;
        if (bird.vy > MAX_FALL_SPEED) bird.vy = MAX_FALL_SPEED;
       
        bird.x += bird.vx;
        bird.y += bird.vy;

        // Rotation based on velocity
        let targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy * 0.1)));
        // Flip rotation if going left
        if (bird.vx < 0) targetRotation *= -1;
        bird.rotation += (targetRotation - bird.rotation) * 0.1;

        // Top/Bottom Boundary Collision
        if (bird.y - BIRD_RADIUS < 0) {
            bird.y = BIRD_RADIUS;
            bird.vy = 0;
        } else if (bird.y + BIRD_RADIUS > GAME_HEIGHT) {
            gameOver();
            return;
        }

        checkCollisions();
        updateParticles();

        // --- Update Trail and Background ---
        trail.push({x: bird.x, y: bird.y});
        if (trail.length > 10) trail.shift(); // Keep trail short
       
        frameCount++;
    }

    function checkCollisions() {
        // --- Pipe Collision Detection ---
       
        // Helper function for Circle-Rectangle collision
        function isColliding(cx, cy, radius, rx, ry, rw, rh) {
            let testX = cx;
            let testY = cy;

            if (cx < rx) testX = rx;
            else if (cx > rx + rw) testX = rx + rw;
            if (cy < ry) testY = ry;
            else if (cy > ry + rh) testY = ry + rh;

            let distX = cx - testX;
            let distY = cy - testY;
            let distance = Math.sqrt((distX*distX) + (distY*distY));

            return distance <= radius;
        }

        // Define pipe bounding boxes
        const rightTopPipe = { x: GAME_WIDTH - PIPE_WIDTH, y: 0, w: PIPE_WIDTH, h: walls.right.gapY - GAP_SIZE/2 };
        const rightBotPipe = { x: GAME_WIDTH - PIPE_WIDTH, y: walls.right.gapY + GAP_SIZE/2, w: PIPE_WIDTH, h: GAME_HEIGHT };
       
        const leftTopPipe = { x: 0, y: 0, w: PIPE_WIDTH, h: walls.left.gapY - GAP_SIZE/2 };
        const leftBotPipe = { x: 0, y: walls.left.gapY + GAP_SIZE/2, w: PIPE_WIDTH, h: GAME_HEIGHT };

        // Check if hitting pipes (only on the wall we are currently flying towards)
        let hitRight = bird.vx > 0 && (
            isColliding(bird.x, bird.y, BIRD_RADIUS, rightTopPipe.x, rightTopPipe.y, rightTopPipe.w, rightTopPipe.h) ||
            isColliding(bird.x, bird.y, BIRD_RADIUS, rightBotPipe.x, rightBotPipe.y, rightBotPipe.w, rightBotPipe.h)
        );

        let hitLeft = bird.vx < 0 && (
            isColliding(bird.x, bird.y, BIRD_RADIUS, leftTopPipe.x, leftTopPipe.y, leftTopPipe.w, leftTopPipe.h) ||
            isColliding(bird.x, bird.y, BIRD_RADIUS, leftBotPipe.x, leftBotPipe.y, leftBotPipe.w, leftBotPipe.h)
        );

        if (hitRight || hitLeft) {
            gameOver();
            return;
        }

        // --- Wall Bounce Logic (Scoring) ---
       
        // Hit Right Wall (Inside Gap)
        if (bird.x + BIRD_RADIUS >= GAME_WIDTH) {
            bird.x = GAME_WIDTH - BIRD_RADIUS;
            bird.vx = -HORIZONTAL_SPEED; // Bounce Left
            scorePoint('right');
        }
       
        // Hit Left Wall (Inside Gap)
        if (bird.x - BIRD_RADIUS <= 0) {
            bird.x = BIRD_RADIUS;
            bird.vx = HORIZONTAL_SPEED; // Bounce Right
            scorePoint('left');
        }
    }

    function scorePoint(wallHit) {
        score++;
        bgScore.innerText = score;
        playSound('score');
       
        // Increase difficulty slightly
        if (GAP_SIZE > 90) GAP_SIZE -= 1.5;
        // Slightly increase horizontal speed every 5 points, max 8
        if (score % 5 === 0 && Math.abs(bird.vx) < 8) {
            bird.vx = (Math.abs(bird.vx) + 0.5) * Math.sign(bird.vx);
        }

        createExplosion(wallHit === 'right' ? GAME_WIDTH : 0, bird.y, COLOR_PIPE_CAP, 15);

        // Generate new gap on the OPPOSITE wall
        if (wallHit === 'right') {
            walls.left.gapY = getRandomGapY();
            walls.left.active = true;
        } else {
            walls.right.gapY = getRandomGapY();
            walls.right.active = true;
        }
    }

    // --- Particle System ---
   
    function createParticles(x, y, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4 + 2, // Bias downwards
                life: 1,
                decay: Math.random() * 0.05 + 0.02,
                size: Math.random() * 4 + 2,
                color: 'rgba(255, 255, 255, 0.5)'
            });
        }
    }

    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: Math.random() * 0.03 + 0.015,
                size: Math.random() * 6 + 3,
                color: color
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    // --- Rendering ---

    function draw() {
        // Clear Canvas
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        ctx.save();

        drawDynamicBackground();
        drawTrail();
        drawPipes();
        drawParticles();
       
        if (gameState !== 'GAMEOVER') {
            drawBird();
        }
       
        ctx.restore();
    }

    function drawDynamicBackground() {
        // Subtle moving grid to give a sense of speed
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        const gridSize = 50;
       
        // Move grid horizontally based on bird direction, vertically based on time
        const offsetX = (bird.vx > 0 ? -frameCount : frameCount) % gridSize;
        const offsetY = (frameCount * 0.5) % gridSize;
       
        ctx.beginPath();
        for (let x = -gridSize; x < GAME_WIDTH + gridSize; x += gridSize) {
            ctx.moveTo(x + offsetX, 0);
            ctx.lineTo(x + offsetX, GAME_HEIGHT);
        }
        for (let y = -gridSize; y < GAME_HEIGHT + gridSize; y += gridSize) {
            ctx.moveTo(0, y + offsetY);
            ctx.lineTo(GAME_WIDTH, y + offsetY);
        }
        ctx.stroke();
    }

    function drawTrail() {
        if (trail.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
        }
        // Fading trail effect
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.3)'; // Semi-transparent bird color
        ctx.lineWidth = BIRD_RADIUS * 1.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
    }

    function drawPipes() {
        // Function to draw a stylized pipe
        function drawPipeSegment(x, y, w, h, isTop) {
            if (h <= 0) return;
           
            // Main body
            ctx.fillStyle = COLOR_PIPE;
            ctx.fillRect(x, y, w, h);
           
            // Highlight
            ctx.fillStyle = COLOR_PIPE_CAP;
            ctx.fillRect(x + 5, y, 5, h);
           
            // Dark edge
            ctx.fillStyle = COLOR_PIPE_DARK;
            ctx.fillRect(x + w - 10, y, 10, h);
           
            // Cap (the thicker part at the gap opening)
            const capHeight = 20;
            const capY = isTop ? y + h - capHeight : y;
            const capWidth = w + 8;
            const capX = x - 4;
           
            if (h >= capHeight) {
                ctx.fillStyle = COLOR_PIPE_DARK;
                // Shadow under cap
                if (isTop) ctx.fillRect(capX + 4, capY + 4, capWidth, capHeight);
               
                ctx.fillStyle = COLOR_PIPE_CAP;
                ctx.fillRect(capX, capY, capWidth, capHeight);
               
                // Border
                ctx.strokeStyle = COLOR_PIPE_DARK;
                ctx.lineWidth = 3;
                ctx.strokeRect(capX, capY, capWidth, capHeight);
            }
        }

        // Right Wall Pipes
        let rGapTop = walls.right.gapY - GAP_SIZE/2;
        let rGapBot = walls.right.gapY + GAP_SIZE/2;
        drawPipeSegment(GAME_WIDTH - PIPE_WIDTH, 0, PIPE_WIDTH, rGapTop, true);
        drawPipeSegment(GAME_WIDTH - PIPE_WIDTH, rGapBot, PIPE_WIDTH, GAME_HEIGHT - rGapBot, false);

        // Left Wall Pipes
        let lGapTop = walls.left.gapY - GAP_SIZE/2;
        let lGapBot = walls.left.gapY + GAP_SIZE/2;
        drawPipeSegment(0, 0, PIPE_WIDTH, lGapTop, true);
        drawPipeSegment(0, lGapBot, PIPE_WIDTH, GAME_HEIGHT - lGapBot, false);
    }

    function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
       
        // Flip rendering horizontally if moving left
        if (bird.vx < 0) {
            ctx.scale(-1, 1);
        }
        ctx.rotate(bird.rotation);

        // Bird Body
        ctx.beginPath();
        ctx.arc(0, 0, BIRD_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = COLOR_BIRD;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLOR_BIRD_OUTLINE;
        ctx.stroke();

        // Eye
        ctx.beginPath();
        ctx.arc(6, -4, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(7, -4, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'black';
        ctx.fill();

        // Beak
        ctx.beginPath();
        ctx.moveTo(12, 2);
        ctx.lineTo(22, 5);
        ctx.lineTo(12, 8);
        ctx.fillStyle = '#fbbf24'; // Amber 400
        ctx.fill();
        ctx.strokeStyle = '#d97706'; // Amber 600
        ctx.lineWidth = 2;
        ctx.stroke();
       
        // Wing (Animated based on velocity)
        ctx.beginPath();
        let wingAngle = bird.vy < -2 ? -Math.PI / 4 : (bird.vy > 2 ? Math.PI / 8 : 0);
        ctx.save();
        ctx.translate(-4, 2);
        ctx.rotate(wingAngle);
        ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fda4af'; // Rose 300
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.restore();
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    // --- Main Loop ---
    let lastTime = 0;
    function gameLoop(timestamp) {
        // Delta time could be used for smoother physics regardless of framerate,
        // but fixed updates are easier for simple arcade games.
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Start!
    init();

</script>
</body>
</html>
