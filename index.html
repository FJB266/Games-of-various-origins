<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Dashboard</title>
    <style>
        body {
            background: linear-gradient(135deg, #110924, #1f1a3a, #0d0d1a);
            background-size: 400% 400%;
            animation: bgDrift 20s ease infinite;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes bgDrift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #menu-container {
            width: 700px;
            padding: 40px;
            background: rgba(30, 30, 40, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(255, 255, 255, 0.02);
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8a8a9e;
            font-size: 1rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* 5-Button Grid Setup */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }

        /* Styling for the game selection buttons */
        .game-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 25px 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none; /* In case you use <a> tags instead */
        }

        /* Custom color rules / Grid spans to balance out 5 items gracefully */
        .game-btn:nth-child(1) { grid-column: span 2; border-color: #00f2fe; }
        .game-btn:nth-child(2) { grid-column: span 2; border-color: #b224ef; }
        .game-btn:nth-child(3) { grid-column: span 2; border-color: #ff416c; }
        .game-btn:nth-child(4) { grid-column: span 3; border-color: #ffb300; }
        .game-btn:nth-child(5) { grid-column: span 3; border-color: #00ffcc; }

        .game-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Hover glows tailored per button color */
        .game-btn:nth-child(1):hover { box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3); }
        .game-btn:nth-child(2):hover { box-shadow: 0 10px 25px rgba(178, 36, 239, 0.3); }
        .game-btn:nth-child(3):hover { box-shadow: 0 10px 25px rgba(255, 65, 108, 0.3); }
        .game-btn:nth-child(4):hover { box-shadow: 0 10px 25px rgba(255, 179, 0, 0.3); }
        .game-btn:nth-child(5):hover { box-shadow: 0 10px 25px rgba(0, 255, 204, 0.3); }

        .game-btn:active {
            transform: translateY(-1px);
        }

        .btn-icon {
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div id="menu-container">
        <h1>MY ARCADE</h1>
        <div class="subtitle">Select a game to launch</div>

        <div class="game-grid">
            <button class="game-btn" onclick="launchGame('tetris.html')">
                <span class="btn-icon">🧩</span>
                <span>TETR.CLONE</span>
            </button>

            <button class="game-btn" onclick="launchGame('pokemon-auraus.html')">
                <span class="btn-icon">🐉</span>
                <span>Pokemon Auraus</span>
            </button>

            <button class="game-btn" onclick="launchGame('snake.html')">
                <span class="btn-icon">🐍</span>
                <span>Snake Retro</span>
            </button>

            <button class="game-btn" onclick="launchGame('trig-run-main/public/trig-run.html')">
                <span class="btn-icon">🏎️</span>
                <span>Geometry Dash</span>
            </button>

            <button class="game-btn" onclick="launchGame('game5.html')">
                <span class="btn-icon">⚔️</span>
                <span>RPG Quest</span>
            </button>
        </div>
    </div>

    <script>
        function launchGame(fileUrl) {
            // Smoothly redirects the tab to your game file
            window.location.href = fileUrl;
        }
    </script>
</body>
</html>
